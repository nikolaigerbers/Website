<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikolai Gerbers - Designarchiv</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1 -->
  <div class="screen-1" style="height:100dvh; display:flex; flex-direction:column; overflow:hidden;">
    <header class="site-header">
      <div class="header-top">
        <a href="index.html"><img src="data/Logo/NikolaiGerbersDesignarchiv_Logo.png" class="logo-header"></a>
        <button class="burger-btn" id="burgerBtn" aria-label="Menü öffnen">
          <img src="data/Icons/BurgerMenuIcon.PNG" alt="Menü" />
        </button>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="produkte.html">Produkte</a></li>
          <li><a href="hersteller_designer.html">Hersteller & Designer</a></li>
          <li><a href="informationen.html">Informationen</a></li>
        </ul>
      </nav>
    </header>

    <!-- Nav Overlay (position:fixed, Screen-Zugehörigkeit egal) -->
    <div class="nav-overlay" id="navOverlay">
      <div class="nav-drawer" id="navDrawer">
        <button class="drawer-close" id="drawerClose" aria-label="Menü schließen">✕</button>
        <nav>
          <ul>
            <li><a href="produkte.html">Produkte</a></li>
            <li><a href="hersteller_designer.html">Hersteller & Designer</a></li>
            <li><a href="informationen.html">Informationen</a></li>
          </ul>
        </nav>
      </div>
    </div>

    <div class="hero-image-wrap">
      <a href="produkte.html" style="display:contents">
        <img src="data/Startseite/CHAIRS.PNG" class="hero-image" alt="Komposition mit Stühlen">
      </a>
    </div>

    <div class="hero-tagline">
      <span class="tagline-line1">
        <span class="tagline-black">Design.</span> <span class="tagline-highlight">wieder entdeckt</span>
      </span>
      <span class="tagline-sub">collect / restore / sell</span>
    </div>
  </div>

  <!-- Screen 2 -->
  <div class="screen-2">
    <main class="main-main">
      <h1>Neuheiten</h1>
      <div class="neuheiten-slider">
        <button class="slider-btn neuheiten-prev">&#8963;</button>
        <div class="neuheiten-track-wrapper">
          <div class="neuheiten-track"></div>
        </div>
        <button class="slider-btn neuheiten-next">&#8963;</button>
      </div>
      <div class="neuheiten-dots"></div>
      <br><br>
      <div class="centered">
        <a href="produkte.html" class="anfrage-btn">Alle Produkte</a>
      </div>
      <br><br>
    </main>
    <footer class="site-footer">
      <ul class="footer-nav">
        <li><a href="kontakt.html">Kontakt</a></li>
        <li><a href="impressum.html">Impressum</a></li>
      </ul>
      <span class="footer-branding">Designarchiv - Nikolai Gerbers</span>
    </footer>
  </div>

<script src="script.js"></script>
</body>
</html>
